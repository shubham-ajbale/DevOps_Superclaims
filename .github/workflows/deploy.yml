
name: DevOps Assessment CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_BACKEND_REPOSITORY: devops-assignment-backend
  ECR_FRONTEND_REPOSITORY: devops-assignment-frontend

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Diagnose GitHub OIDC claims
      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info('========== OIDC DIAGNOSTICS ==========');
            core.info('ISS: ' + payload.iss);
            core.info('AUD: ' + JSON.stringify(payload.aud));
            core.info('SUB: ' + payload.sub);
            core.info('======================================');

      # 3. Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSession
          mask-aws-account-id: false

      # 4. Verify AWS identity
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "AWS Region: ${AWS_REGION}"
          echo "AWS Account: ${AWS_ACCOUNT_ID}"

          test "${AWS_REGION}" = "ap-south-1"

      # 5. Verify ECR access
      - name: Verify ECR access
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ECR authorization..."

          aws ecr get-login-password \
            --region "${AWS_REGION}" > /dev/null

          echo "Checking backend repository..."

          aws ecr describe-repositories \
            --repository-names "${ECR_BACKEND_REPOSITORY}" \
            --region "${AWS_REGION}"

          echo "Checking frontend repository..."

          aws ecr describe-repositories \
            --repository-names "${ECR_FRONTEND_REPOSITORY}" \
            --region "${AWS_REGION}"

          echo "ECR verification successful."

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest

      # 8. Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest

      # 9. Deploy to EC2 Ubuntu
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,IMAGE_TAG
          script_stop: true
          script: |
            set -eu

            echo "========== EC2 DEPLOYMENT =========="

            echo "Connected user:"
            whoami

            cd /home/ubuntu/devops-assignment

            echo "Application directory:"
            pwd

            echo "Checking AWS CLI..."

            if ! command -v aws >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y awscli
            fi

            echo "Checking Docker..."

            docker --version
            docker compose version

            REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            BACKEND_IMAGE="${REGISTRY}/devops-assignment-backend:${IMAGE_TAG}"
            FRONTEND_IMAGE="${REGISTRY}/devops-assignment-frontend:${IMAGE_TAG}"

            echo "Checking EC2 IAM role..."

            aws sts get-caller-identity

            echo "Logging in to ECR..."

            aws ecr get-login-password \
              --region "${AWS_REGION}" \
              | docker login \
                  --username AWS \
                  --password-stdin "${REGISTRY}"

            echo "Pulling application images..."

            BACKEND_IMAGE="${BACKEND_IMAGE}" \
            FRONTEND_IMAGE="${FRONTEND_IMAGE}" \
              docker compose -f docker-compose.prod.yml pull

            echo "Starting application..."

            BACKEND_IMAGE="${BACKEND_IMAGE}" \
            FRONTEND_IMAGE="${FRONTEND_IMAGE}" \
              docker compose -f docker-compose.prod.yml up \
                -d --remove-orphans

            echo "Waiting for application startup..."

            sleep 10

            echo "Checking application health..."

            curl --fail --silent --show-error \
              http://localhost/api/health/

            echo ""
            echo "Application deployed successfully!"

            echo "Running containers:"
            docker compose -f docker-compose.prod.yml ps

            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo "========== DEPLOYMENT COMPLETE =========="


name: DevOps Assessment CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_BACKEND_REPOSITORY: devops-assignment-backend
  ECR_FRONTEND_REPOSITORY: devops-assignment-frontend

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSession
          mask-aws-account-id: false

      - name: Verify AWS identity
        run: |
          set -e
          aws sts get-caller-identity
          echo "Region: ${AWS_REGION}"
          echo "Account: ${AWS_ACCOUNT_ID}"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,IMAGE_TAG
          script_stop: true
          script: |
            set -eu

            echo "========== EC2 DEPLOYMENT =========="
            whoami

            cd /home/ubuntu/devops-assignment
            pwd

            if ! command -v aws >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y awscli
            fi

            docker --version
            docker compose version

            REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            export BACKEND_IMAGE="${REGISTRY}/devops-assignment-backend:${IMAGE_TAG}"
            export FRONTEND_IMAGE="${REGISTRY}/devops-assignment-frontend:${IMAGE_TAG}"

            echo "Checking EC2 IAM role..."
            aws sts get-caller-identity

            echo "Logging in to ECR..."
            aws ecr get-login-password \
              --region "${AWS_REGION}" \
              | docker login \
                  --username AWS \
                  --password-stdin "${REGISTRY}"

            echo "Pulling images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Starting application..."
            docker compose -f docker-compose.prod.yml up \
              -d --remove-orphans

            sleep 10

            echo "Checking application health..."
            curl --fail --silent --show-error \
              http://localhost/api/health/

            echo ""
            echo "Running containers:"
            docker compose -f docker-compose.prod.yml ps

            echo "Cleaning unused images..."
            docker image prune -f

            echo "========== DEPLOYMENT COMPLETE =========="


name: DevOps Assessment CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_BACKEND_REPOSITORY: devops-assignment-backend
  ECR_FRONTEND_REPOSITORY: devops-assignment-frontend

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Diagnose GitHub OIDC claims
      - name: Diagnose GitHub OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info('========== OIDC DIAGNOSTICS ==========');
            core.info('ISS: ' + payload.iss);
            core.info('AUD: ' + JSON.stringify(payload.aud));
            core.info('SUB: ' + payload.sub);
            core.info('======================================');

      # 3. Configure AWS credentials using OIDC
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSession
          mask-aws-account-id: false

      # 4. Verify AWS identity and region
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "Checking AWS region..."
          echo "AWS_REGION=${AWS_REGION}"

          test -n "${AWS_REGION}"
          test "${AWS_REGION}" = "ap-south-1"

          echo "AWS identity and region verification successful."

      # 5. Verify ECR access
      - name: Verify ECR access
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ECR authorization..."

          aws ecr get-login-password \
            --region "$AWS_REGION" > /dev/null

          echo "ECR authorization successful."

          echo "Checking backend ECR repository..."

          aws ecr describe-images \
            --repository-name "$ECR_BACKEND_REPOSITORY" \
            --region "$AWS_REGION" \
            --max-items 1

          echo "Checking frontend ECR repository..."

          aws ecr describe-images \
            --repository-name "$ECR_FRONTEND_REPOSITORY" \
            --region "$AWS_REGION" \
            --max-items 1

          echo "ECR access verification completed."

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest

      # 8. Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest

      # 9. Deploy application to EC2
      - name: Deploy to existing EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,IMAGE_TAG
          script_stop: true
          script: |
            set -eu

            cd /root/devops-assignment

            if ! command -v aws >/dev/null 2>&1; then
              apt-get update
              apt-get install -y awscli
            fi

            REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            BACKEND_IMAGE="${REGISTRY}/devops-assignment-backend:${IMAGE_TAG}"
            FRONTEND_IMAGE="${REGISTRY}/devops-assignment-frontend:${IMAGE_TAG}"

            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${REGISTRY}"

            echo "Pulling backend and frontend images..."

            BACKEND_IMAGE="${BACKEND_IMAGE}" \
            FRONTEND_IMAGE="${FRONTEND_IMAGE}" \
              docker compose -f docker-compose.prod.yml pull

            echo "Starting application containers..."

            BACKEND_IMAGE="${BACKEND_IMAGE}" \
            FRONTEND_IMAGE="${FRONTEND_IMAGE}" \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for application startup..."
            sleep 10

            echo "Checking application health..."

            curl --fail --silent --show-error \
              http://localhost/api/health/

            echo ""
            echo "Deployment completed successfully!"

            docker image prune -f
